<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>NAVI demo film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Sans:wght@500;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0A0B0D; }
  body { font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; color: #EEEFE9; }
  #bg { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 70% 20%, #16201C 0%, #0A0B0D 60%); }
  .scene { position: absolute; inset: 0; will-change: transform, opacity, filter; }
  .cam { position: absolute; inset: 0; }
  .stage { position: absolute; inset: 104px 96px 210px; display: flex; gap: 56px; align-items: center; justify-content: center; }
  .device { position: relative; flex: none; }
  .browser { border-radius: 18px; overflow: hidden; background: #0F1113; box-shadow: 0 40px 120px #000c, 0 0 0 1px #ffffff14; }
  .browser .bar { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #1A1D20; }
  .browser .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3A3F44; display: block; }
  .browser .bar span { margin-left: 18px; font: 18px 'DM Sans', sans-serif; color: #8D969B; background: #0F1113; border-radius: 8px; padding: 4px 16px; }
  .phone { border-radius: 58px; padding: 14px; background: #1B1E21; box-shadow: 0 40px 120px #000c, inset 0 0 0 2px #2C3135; }
  .phone .screen { border-radius: 46px; overflow: hidden; position: relative; }
  .phone .notch { position: absolute; top: 12px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; z-index: 2; }
  .shot { display: block; position: relative; }
  .shot img { display: block; width: 100%; height: 100%; }
  .shot svg { position: absolute; inset: 0; overflow: visible; }
  .veil { position: absolute; inset: 0; background: #050706; opacity: 0; border-radius: inherit; }
  .label { position: absolute; z-index: 5; font-size: 30px; font-weight: 700; line-height: 1.35; color: #0A0B0D; background: #EEEFE9; border-radius: 14px; padding: 14px 22px; box-shadow: 0 12px 40px #0008; white-space: nowrap; opacity: 0; }
  .label::before { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #00B26E; box-shadow: 0 0 0 5px #00B26E44; }
  .label.right::before { left: -38px; top: 50%; margin-top: -7px; }
  .label.left::before { right: -38px; top: 50%; margin-top: -7px; }
  .label.below::before { left: 26px; top: -34px; }
  .label.above::before { left: 26px; bottom: -34px; }
  .caption { position: absolute; left: 96px; bottom: 72px; opacity: 0; display: flex; align-items: flex-end; gap: 30px; }
  .chip { width: 104px; height: 104px; flex: none; border-radius: 28px; background: #18201D; box-shadow: inset 0 0 0 1px #97C9B333, 0 18px 50px #0007; display: grid; place-items: center; }
  .chip svg { width: 60px; height: 60px; }
  .stepper { position: absolute; right: 96px; bottom: 70px; opacity: 0; }
  .stepper text { font: 500 20px 'Noto Sans TC', sans-serif; fill: #8D969B; letter-spacing: 1px; }
  .stepper text.on { fill: #EEEFE9; font-weight: 700; }
  .object { position: absolute; width: 190px; height: 240px; border-radius: 16px; background: #F7F6F1; box-shadow: 0 30px 80px #000b; opacity: 0; overflow: hidden; z-index: 6; }
  .object .head { height: 46px; background: #00744A; color: #F7F6F1; font-size: 24px; font-weight: 700; display: flex; align-items: center; padding: 0 18px; letter-spacing: 2px; }
  .object .rows { padding: 18px; display: grid; gap: 12px; }
  .object .rows i { display: block; height: 10px; border-radius: 5px; background: #D9D6CF; }
  .object .tagline { position: absolute; left: 18px; bottom: 16px; font-size: 16px; color: #8D969B; }
  .object .stamp { position: absolute; right: 16px; bottom: 14px; width: 54px; height: 54px; border-radius: 50%; border: 3px solid #00915A; color: #00915A; font-size: 14px; font-weight: 900; display: grid; place-items: center; transform: rotate(-14deg); }
  .story { position: absolute; inset: 60px 0 200px; display: grid; place-items: center; }
  .bubble { transform-box: fill-box; transform-origin: 50% 100%; }
  .flow { position: absolute; inset: 120px 96px 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 64px; }
  .flow .row { display: flex; align-items: flex-start; gap: 18px; }
  .flow .node { width: 250px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; opacity: 0; }
  .flow .disc { width: 132px; height: 132px; border-radius: 50%; background: #18201D; box-shadow: inset 0 0 0 2px #97C9B344, 0 24px 60px #0008; display: grid; place-items: center; }
  .flow .disc.end { background: #00B26E; box-shadow: 0 0 0 8px #00B26E33, 0 24px 60px #0008; }
  .flow .disc svg { width: 64px; height: 64px; }
  .flow .node b { font-size: 32px; } .flow .node small { font-size: 22px; color: #8D969B; }
  .flow .arrow { margin-top: 54px; flex: none; }
  .flow .stats { display: grid; grid-template-columns: repeat(4, 260px); gap: 28px; }
  .flow .stat { border-top: 4px solid #00B26E; padding-top: 16px; opacity: 0; } .flow .stat b { font: 700 72px 'DM Sans', sans-serif; display: block; } .flow .stat small { font-size: 22px; color: #8D969B; }
  .flow .note { font-size: 30px; color: #B9C7C0; max-width: 1300px; text-align: center; line-height: 1.5; opacity: 0; }
  .caption .section { font-size: 24px; letter-spacing: 6px; color: #97C9B3; margin-bottom: 14px; }
  .caption .line { font-size: 56px; font-weight: 700; letter-spacing: 1px; }
  #badge { position: absolute; top: 44px; right: 56px; font-size: 22px; letter-spacing: 2px; color: #97C9B3; border: 1px solid #97C9B355; border-radius: 999px; padding: 8px 18px; }
  #subtitle { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 1500px; font-size: 30px; font-weight: 500; line-height: 1.4; color: #EEEFE9; background: #0A0B0Dcc; border-radius: 10px; padding: 6px 18px; white-space: nowrap; opacity: 0; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 28px; }
  .mark-logo { position: relative; width: 150px; height: 150px; border-radius: 40px; background: #EEEFE9; display: grid; place-items: center; }
  .mark-logo path { stroke-dasharray: 1; }
  .mark-logo .flash { position: absolute; inset: -12px; border-radius: 50px; border: 3px solid #00B26E; opacity: 0; }
  .name { font: 700 140px 'DM Sans', sans-serif; letter-spacing: 28px; margin-right: -28px; display: flex; }
  .name span { display: inline-block; }
  .tag { font-size: 40px; letter-spacing: 14px; color: #97C9B3; }
  .sub { font-size: 30px; color: #8D969B; letter-spacing: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px; width: 1680px; margin-top: 20px; }
  .tile { display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .tile .pic { width: 100%; height: 520px; border-radius: 22px; overflow: hidden; background: #0F1113; box-shadow: 0 0 0 1px #ffffff1a; }
  .tile .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .tile b { font-size: 30px; display: flex; align-items: center; gap: 10px; } .tile b svg { width: 34px; height: 34px; } .tile small { font-size: 22px; color: #8D969B; }
  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 20; filter: drop-shadow(0 3px 6px #0009); opacity: 0; }
  #ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid #00B26E; z-index: 19; opacity: 0; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="scenes"></div>
<div id="badge">示範模式・合成資料</div>
<div id="subtitle"></div>
<div id="ripple"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#EEEFE9" stroke="#0A0B0D" stroke-width="1.4" stroke-linejoin="round"/></svg>
<script>
const params = new URLSearchParams(location.search);
// ───────── Timing: 110 BPM, 4/4. Every scene starts on a bar; every action lands on a beat. ─────────
const BPM = Number(params.get('bpm') ?? 110), BEAT = 60 / BPM, BAR = 4 * BEAT; // 110 BPM: 0.545 s, 2.18 s
const at = (bar, beat = 1) => (bar - 1) * BAR + (beat - 1) * BEAT;
const VERSION = params.get('version') === 'vo' ? 'vo' : 'text';
const DATA = window.FILM_DATA;                               // B-roll report, injected by render.js
const shotOf = key => { const s = DATA.shots[key]; if (!s) throw new Error(`Missing shot ${key}`); return s; };

// Scenes in bars. `vo` is the narration line (read at ~4.6 characters a second; each fits its scene).
const SCENES = [
  { bars: 3, card: 'story', section: '情境', caption: '出院了，接下來要怎麼辦？' },
  { bars: 4, card: 'concept', vo: '理賠要準備什麼？該去哪裡辦？NAVI 是嵌在保險官網裡的智慧服務導航助手：理解、檢核、帶你去。' },
  { bars: 2, section: '01　痛點', caption: '資訊都在，卻散在不同分頁', icon: 'tabs', shots: [['desktop/claims']], vo: '官網資訊很完整，卻分散在不同分頁。' },
  { bars: 3, section: '01　痛點', caption: '看完還是不確定要準備什麼', icon: 'docs', shots: [['desktop/claims-documents']], vo: '十七類理賠各有文件規定，看完還是不確定要準備什麼。' },
  { bars: 2, section: '02　遇見 NAVI', caption: '不用離開官網，說出你的情況', icon: 'chat', shots: [['desktop/navi-welcome']], vo: '打開 NAVI，不用離開官網。', enter: 'zoom' },
  { bars: 4, section: '02　核心介面', caption: '五個核心介面，一起帶你完成', icon: 'grid', card: 'interfaces', vo: '聊天室、旅程卡、工作區、導覽卡，加上官網高亮，一起帶你完成。' },
  { bars: 3, section: '03　理解', caption: '問得太籠統？先問清楚', icon: 'options', shots: [['desktop/navi-follow-up']], click: true, vo: '問得太籠統時，NAVI 會先問清楚，選一個就好。' },
  { bars: 4, section: '03　理解', caption: '每個答案都能追溯官網原文', icon: 'source', shots: [['desktop/navi-answer-source']], vo: '每個答案都附官網原文和擷取日期，不讓 AI 自己編。' },
  { bars: 3, section: '03　理解', caption: '官網改了什麼，先比對、再審核', icon: 'hash', card: 'flow', flow: 'refresh' },
  { bars: 2, section: '04　帶你去', caption: '先給答案，再一鍵帶你去', icon: 'chat', shots: [['desktop/navi-address-answer']], enter: 'whip', vo: '要改地址？NAVI 先給答案，再一步一步帶你到官網的正確位置。' },
  { bars: 2, section: '04　帶你去', caption: '一步一步帶到正確位置', icon: 'stairs', guide: 1, shots: [['desktop/guide-step-1']], enter: 'whip' },
  { bars: 2, section: '04　帶你去', caption: '官網跟著換頁、框出目標', icon: 'stairs', guide: 2, shots: [['desktop/guide-step-2']], enter: 'whip' },
  { bars: 3, section: '04　帶你去', caption: '手機也一樣順', icon: 'phone', guide: 3, shots: [['desktop/guide-step-3', { marks: false }], ['mobile/guide-step-3-card', { side: 'above' }]], enter: 'zoom', vo: '在手機上也一樣，收合後隨時回到下一步。' },
  { bars: 3, section: '05　檢核', caption: '一句話建立住院理賠旅程', icon: 'hospital', shots: [['mobile/journey-card'], ['desktop/workspace-35', { marks: false }]], click: true, enter: 'whip', vo: '說一句「我住院五天要申請理賠」，就建立服務旅程。' },
  { bars: 2, section: '05　檢核', caption: '上傳診斷書，準備度 70%', icon: 'upload', object: ['診斷書', '住院 5 天'], shots: [['mobile/workspace-70']], vo: '上傳診斷書，準備度 70%；缺什麼、為什麼、怎麼補，一眼看懂。' },
  { bars: 2, section: '05　檢核', caption: '缺什麼、為什麼、怎麼補', icon: 'checklist', shots: [['mobile/workspace-preflight']] },
  { bars: 2, section: '05　檢核', caption: '補上存摺，準備度 90%', icon: 'upload', object: ['存摺影本', '末四碼 1234'], shots: [['mobile/workspace-90']] },
  { bars: 2, section: '05　檢核', caption: '確認資料，才算準備完成', icon: 'source', shots: [['desktop/review-dialog']], click: true },
  { bars: 3, section: '05　檢核', caption: '資料準備完成 100%', icon: 'badge', shots: [['desktop/workspace-100']], enter: 'zoom', drop: true, vo: '百分之百只代表資料備齊，不代表理賠核准。' },
  { bars: 3, section: '06　可信', caption: 'AI 理解，系統決定', icon: 'spark', card: 'flow', flow: 'principle', vo: 'AI 只負責理解，計分、答案和導覽都由規則與官網資料決定。' },
  { bars: 2, section: '06　可信', caption: '不給投保建議，不判斷能否理賠', icon: 'shield', shots: [['desktop/navi-guardrail']], vo: 'NAVI 不給投保建議，也不判斷能否理賠。' },
  { bars: 2, section: '06　可信', caption: '需要真人時，確認後才取得摘要', icon: 'headset', shots: [['mobile/handoff']], vo: '需要真人時，確認後才取得交接摘要。' },
  { bars: 6, card: 'logo', vo: 'NAVI 智慧服務導航助手。理解、檢核、帶你去。' },
];
let bar = 1;
for (const s of SCENES) { s.bar = bar; s.start = at(bar); s.end = at(bar + s.bars); bar += s.bars; }
const TOTAL_BARS = bar - 1;                                   // 64 bars ≈ 2:20 at 110 BPM
const DURATION = at(TOTAL_BARS + 1);
// Music sections (bars), read by the audio generator.
// Music sections (bars) follow the scenes, so adding or removing a scene keeps the score in step.
const span = pick => { const xs = SCENES.filter(pick); return [xs[0].bar, xs.at(-1).bar + xs.at(-1).bars - 1]; };
const chapter = n => s => s.section?.startsWith(n);
const MUSIC = {
  bpm: BPM, bars: TOTAL_BARS, intro: span(s => s.card === 'story' || s.card === 'concept'), pain: span(chapter('01')),
  groove: span(s => chapter('02')(s) || chapter('03')(s)), lift: span(chapter('04')), build: span(s => chapter('05')(s) && !s.drop),
  drop: span(s => s.drop), breakdown: span(chapter('06')), outro: span(s => s.card === 'logo'),
};

// ───────── Motion helpers ─────────
function step(t, freq = 1.6, zeta = 0.9) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * freq, wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const ease = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const TRANS = 0.36;                                           // half a transition, centred on the bar line

// ───────── Build the scenes once ─────────
const $ = id => document.getElementById(id);
// ───────── Art: line icons, the opening illustration, document objects, the guide stepper (all drawn here) ─────────
const ICONS = {
  tabs: '<path d="M3 9h18v11H3z"/><path d="M3 9V5.5h5.5V9M8.5 9V5.5H14V9"/><path d="M6.5 13h8M6.5 16h5"/>',
  docs: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M10.4 11a2.1 2.1 0 1 1 2.7 2c-.6.2-1.1.7-1.1 1.4v.6"/><path d="M12 18.2h.01"/>',
  chat: '<path d="M4 5h16v11H9.5L4 20z"/><path d="M8 9.5h8M8 12.5h5"/>',
  grid: '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
  options: '<path d="M4 3.5h16v8.5H9l-5 3.5z"/><rect x="3" y="17" width="5.5" height="4" rx="2"/><rect x="9.25" y="17" width="5.5" height="4" rx="2"/><rect x="15.5" y="17" width="5.5" height="4" rx="2"/>',
  source: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 14l2 2 4-4.2"/>',
  stairs: '<path d="M4.5 19.5v-5h5v-5h5v-5h5"/><path d="M16.5 4.5h3v3"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.6h2"/>',
  hospital: '<path d="M4.5 21V7.5h15V21"/><path d="M2.5 21h19"/><path d="M12 9.6v5M9.5 12.1h5"/><path d="M9.5 21v-3h5v3"/>',
  upload: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M12 17.5V11M9.4 13.6 12 11l2.6 2.6"/>',
  checklist: '<rect x="5" y="4" width="14" height="17" rx="2.2"/><path d="M9 4V2.8h6V4"/><path d="M8 10.2l1.5 1.5 2.6-2.6M8 15.8l1.5 1.5 2.6-2.6M14.4 10.6h2M14.4 16.2h2"/>',
  badge: '<circle cx="12" cy="12" r="8.6"/><path d="M8.4 12.2l2.5 2.5 4.8-5"/>',
  shield: '<path d="M12 2.8l7.2 3v5.3c0 4.6-3.1 8.1-7.2 10.1-4.1-2-7.2-5.5-7.2-10.1V5.8z"/><path d="M9.2 12.1l2 2 3.8-4"/>',
  headset: '<path d="M5 14v-2a7 7 0 0 1 14 0v2"/><rect x="3.4" y="13" width="3.6" height="6" rx="1.6"/><rect x="17" y="13" width="3.6" height="6" rx="1.6"/><path d="M19 19c0 1.6-2 2.6-5 2.6"/>',
  spark: '<path d="M12 2.8l1.9 5.6 5.6 1.9-5.6 1.9L12 17.8l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
  person: '<circle cx="12" cy="7.6" r="3.8"/><path d="M4.8 20.6c0-4 3.2-7.2 7.2-7.2s7.2 3.2 7.2 7.2"/>',
  rules: '<path d="M12 3v17.5M7 20.5h10M5 7h14"/><path d="M5 7l-2.8 6a2.8 2.8 0 0 0 5.6 0zM19 7l-2.8 6a2.8 2.8 0 0 0 5.6 0z"/>',
  globe: '<circle cx="12" cy="12" r="8.8"/><path d="M3.2 12h17.6M12 3.2c2.4 2.6 3.7 5.6 3.7 8.8s-1.3 6.2-3.7 8.8c-2.4-2.6-3.7-5.6-3.7-8.8S9.6 5.8 12 3.2z"/>',
  layers: '<path d="M12 3.2l8.8 4.8-8.8 4.8L3.2 8z"/><path d="M3.2 12.4l8.8 4.8 8.8-4.8M3.2 16.4l8.8 4.8 8.8-4.8"/>',
  hash: '<path d="M9.5 3 7.5 21M16.5 3l-2 18M4.5 8.5h16M3.5 15.5h16"/>',
  eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  target: '<circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.6"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3"/>',
};
const icon = (name, stroke = '#97C9B3', width = 1.6) => `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

// Opening scene: someone just out of hospital, papers in one hand and a phone in the other, with the questions
// everyone has. Flat shapes in the film's palette; the bubbles pop one per beat.
const STORY_BUBBLES = [['理賠要準備什麼？', 232, 120], ['要去哪裡辦？', 828, 96], ['要帶哪些文件？', 846, 262]];
const STORY = `<svg viewBox="0 0 1200 660" width="1200" height="660">
  <defs><radialGradient id="glow" cx="50%" cy="55%" r="50%"><stop offset="0" stop-color="#97C9B3" stop-opacity=".18"/><stop offset="1" stop-color="#97C9B3" stop-opacity="0"/></radialGradient></defs>
  <circle cx="600" cy="360" r="330" fill="url(#glow)"/>
  <g class="hospital" opacity=".9">
    <rect x="150" y="250" width="300" height="330" rx="10" fill="#151C19" stroke="#97C9B333"/>

/** Labels beside their outline on the side with room; measured once, in scene coordinates. */

      const side = (r.side && room[r.side]) ? r.side : ['right', 'left', 'below', 'above'].find(s => room[s]) ?? 'above';
      const x = { right: ring.right + gap, left: ring.left - gap - lw }[side] ?? ring.left;
      const y = { below: ring.bottom + gap, above: ring.top - gap - lh }[side] ?? ring.top + ring.height / 2 - lh / 2;

// ───────── Score: every sound, from the same timeline. Also read by the audio generator. ─────────
function makeScore() {

    if (i > 0) ev.push({ time: s.start, sfx: 'whoosh', hit: s.enter === 'zoom' || s.section?.slice(0, 2) !== SCENES[i - 1].section?.slice(0, 2) });
    s.rings.forEach((r, k) => { const m = markTimes(s, k); ev.push({ time: m.ring, sfx: 'tick' }, { time: m.label, sfx: 'pop' }); if (s.click && k === 0) ev.push({ time: m.ring - BEAT, sfx: 'click' }); });
    if (s.card === 'interfaces') for (let k = 0; k < 5; k++) ev.push({ time: s.start + BEAT * (k + 1), sfx: 'pop' });
    if (s.card === 'flow') {
      FLOWS[s.flow].nodes.forEach((_, k) => ev.push({ time: flowTimes(s, k), sfx: k === FLOWS[s.flow].nodes.length - 1 ? 'success' : 'pop' }));
      (FLOWS[s.flow].stats ?? []).forEach((_, k) => ev.push({ time: statTimes(s, k), sfx: 'tick' }));

      ev.push({ time: it.pop + 0.02, sfx: 'boom' }, { time: it.hook, sfx: 'success' });
      it.steps.forEach((time, k) => ev.push({ time, sfx: 'step', note: STEP_NOTES[k] }));
      [...'NAVI'].forEach((_, k) => ev.push({ time: it.letter(k), sfx: 'type' }));
      if (s.card === 'logo') ev.push({ time: at(s.bar + 4), sfx: 'boom' });
    }

function seek(time) {
  const t = clamp(time, 0, DURATION);
  let cursor = null;
  SCENES.forEach((s, i) => {
    const v = sceneVisibility(s, i, t);
    if (!v) { s.el.style.display = 'none'; return; }
    s.el.style.display = 'block';
    const next = SCENES[i + 1], kind = s.enter ?? 'fade', outKind = next?.enter ?? 'fade';
    // Enter / leave: fade (soft push), zoom (through the screen) or whip (sideways with blur).
    let opacity = v.pin * (1 - v.pout), scale = 1, x = 0, blur = 0;
    const a = 1 - v.pin, b = v.pout;
    if (kind === 'zoom') { scale *= 0.86 + 0.14 * ease(v.pin); blur += a * 10; }

    else if (outKind === 'whip') { x -= 260 * b; blur += b * 14; }
    else { scale *= 1 + 0.03 * b; blur += b * 6; }
    s.el.style.opacity = opacity.toFixed(4);
    s.el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
    s.el.style.transform = `translate(${x.toFixed(2)}px,0) scale(${scale.toFixed(5)})`;

    const local = t - s.start;
    // Camera: a slow drift for the whole scene, plus a gentle push toward the first outline.
    const cam = s.el.querySelector('.cam');
    const drift = 1 + 0.025 * clamp(local / (s.end - s.start));
    if (s.rings.length) {
      const [cx, cy] = s.rings[0].center;
      const push = 1 + 0.07 * step(t - markTimes(s, 0).ring, 0.7, 1);
      cam.style.transformOrigin = `${cx}px ${cy}px`;
      cam.style.transform = `scale(${(drift * push).toFixed(5)})`;
    } else cam.style.transform = `scale(${drift.toFixed(5)})`;

    let dimLevel = 0;

      const m = markTimes(s, k);

      $(r.id).setAttribute('stroke-dashoffset', (1 - draw).toFixed(4));

    });
    s.el.querySelectorAll('.dim').forEach(d => {
      const hasRing = d.closest('svg').querySelector('.ring');
      d.setAttribute('opacity', (hasRing ? 0.62 * dimLevel : 0).toFixed(3));
    });

    s.el.querySelectorAll('.shot').forEach(shot => { shot.querySelector('.veil').style.opacity = shot.querySelector('.ring') ? '0' : (0.55 * dimLevel).toFixed(3); });

    if (s.card === 'concept' || s.card === 'logo') {

      const pop = clamp(step(t - it.pop - 0.02, 1.4, 0.62), 0, 1.3);
      const bump = t > it.hook ? Math.exp(-(t - it.hook) * 7) * Math.sin((t - it.hook) * 22) * 0.07 : 0;

      const flash = clamp((t - it.hook) / 0.6);
      Object.assign(box.querySelector('.flash').style, { opacity: (t < it.hook ? 0 : (1 - flash) * 0.9).toFixed(3), transform: `scale(${(1 + 0.18 * ease(flash)).toFixed(3)})` });

      const dot = box.querySelector('.dot');
      dot.setAttribute('cx', (x0 + (x1 - x0) * f).toFixed(3));
      dot.setAttribute('cy', (y0 + (y1 - y0) * f).toFixed(3));
      // The dot appears with the square and is absorbed into the hook when it arrives.
      const r = 2.2 * smooth((t - it.pop - 0.25) / 0.2) * (1 - smooth((t - it.hook) / 0.15));
      dot.setAttribute('r', r.toFixed(3));
      s.el.querySelectorAll('.name span').forEach((sp, k) => {
        const at0 = it.letter(k), o = smooth((t - at0) / 0.25);
        sp.style.opacity = o.toFixed(3);
        sp.style.transform = `translateY(${(30 * (1 - ease((t - at0) / 0.5))).toFixed(2)}px)`;
      });
      const tag = s.el.querySelector('.tag'), sub = s.el.querySelector('.sub');
      const tagAt = it.tag, subAt = it.sub;
      tag.style.opacity = smooth((t - tagAt) / 0.4).toFixed(3);
      tag.style.letterSpacing = `${(14 + 10 * (1 - ease((t - tagAt) / 1.2))).toFixed(2)}px`;
      sub.style.opacity = smooth((t - subAt) / 0.5).toFixed(3);
      if (s.card === 'logo') {
        // Final bar: everything settles and fades to black on the held chord.
        const out = smooth((t - (DURATION - 1.2)) / 1.1);
        s.el.querySelector('.card').style.opacity = (1 - out).toFixed(3);
      }
    }
    if (s.card === 'flow') {
      s.el.querySelectorAll('.flow .node').forEach(node => {
        const k = Number(node.dataset.k), t0 = flowTimes(s, k);
        node.style.opacity = smooth((t - t0) / 0.25).toFixed(3);
        const p = clamp(step(t - t0, 1.9, 0.6), 0, 1.2);
        node.querySelector('.disc').style.transform = `scale(${p.toFixed(4)})`;
        node.style.transform = `translateY(${(26 * (1 - ease((t - t0) / 0.5))).toFixed(2)}px)`;
      });
      s.el.querySelectorAll('.flow .arrow').forEach(arrow => {
        const k = Number(arrow.dataset.k), t0 = flowTimes(s, k) + BEAT * 0.45;
        arrow.querySelector('path').style.strokeDashoffset = (1 - ease((t - t0) / 0.4)).toFixed(4);
      });
      s.el.querySelectorAll('.flow .stat').forEach(stat => {
        const k = Number(stat.dataset.k), t0 = statTimes(s, k), b = stat.querySelector('b');
        stat.style.opacity = smooth((t - t0) / 0.25).toFixed(3);
        const [num, den] = b.dataset.n.split('/');
        const v = Math.round(Number(num) * ease((t - t0) / 0.7));
        b.textContent = den ? `${v}/${den}` : String(v);
      });
      const note = s.el.querySelector('.flow .note');
      if (note) note.style.opacity = smooth((t - flowTimes(s, FLOWS[s.flow].nodes.length) - BEAT) / 0.5).toFixed(3);
    }
    if (s.card === 'story') {
      const svg = s.el.querySelector('.story svg');
      const rise = ease((t - s.start) / 0.9);
      svg.querySelector('.person').style.transform = `translateY(${(50 * (1 - rise)).toFixed(2)}px)`;
      svg.querySelector('.person').style.opacity = smooth((t - s.start) / 0.5).toFixed(3);
      svg.querySelector('.hospital').style.transform = `translateX(${(-40 * (1 - rise) - 12 * clamp(local / (s.end - s.start))).toFixed(2)}px)`;
      svg.querySelector('.papers').style.transform = `rotate(${(Math.sin(t * 2.4) * 2.2).toFixed(3)}deg)`;
      svg.querySelector('.papers').style.transformOrigin = '520px 460px';
      svg.querySelector('.phone-hand').style.transform = `translateY(${(Math.sin(t * 1.8 + 1) * 3).toFixed(2)}px)`;
      svg.querySelectorAll('.bubble').forEach(b => {
        const k = Number(b.dataset.k), t0 = storyBubble(s, k);
        const p = clamp(step(t - t0, 2.2, 0.55), 0, 1.25);
        b.style.opacity = smooth((t - t0) / 0.12).toFixed(3);
        b.style.transform = `scale(${p.toFixed(4)}) translateY(${(Math.sin((t - t0) * 2 + k) * 4).toFixed(2)}px)`;
      });
    }
    // Icon chip pops with the caption.
    const chipEl = s.el.querySelector('.chip');
    if (chipEl) {
      const c0 = s.start + BEAT * 0.5, p = clamp(step(t - c0, 1.8, 0.6), 0, 1.25);
      chipEl.style.transform = `scale(${p.toFixed(4)}) rotate(${(-8 * (1 - clamp(p))).toFixed(2)}deg)`;
    }
    // Guide stepper: the path grows from the last stop to this one on beat 2; this stop pulses.
    const stepperEl = s.el.querySelector('.stepper');
    if (stepperEl) {
      stepperEl.style.opacity = smooth((t - s.start - BEAT * 0.5) / 0.3).toFixed(3);
      const from = STOP_AT[s.guide - 2] ?? 0, to = STOP_AT[s.guide - 1];
      const g = from + (to - from) * ease((t - s.start - BEAT) / 0.35);
      stepperEl.querySelector('.done').style.strokeDashoffset = (1 - g).toFixed(4);
      const node = stepperEl.querySelector(`.node[data-k="${s.guide - 1}"]`);
      const pulse = 1 + 0.18 * Math.max(0, Math.sin((t - s.start) * Math.PI * 2 / (BEAT * 2)));
      node.setAttribute('r', (13 * (t > s.start + BEAT ? pulse : 1)).toFixed(2));
    }
    // A document card slides in beside the phone, then flies into it just before the outline draws.
    const obj = s.el.querySelector('.object');
    if (obj && s.device) {
      const ot = objectTimes(s), d = s.device;
      const start = [d.x - 330, d.y + d.h * 0.35], end = [d.x + d.w / 2 - 95, d.y + d.h * 0.45];
      const fly = ease((t - ot.fly) / (ot.gone - ot.fly));
      const x = start[0] + (end[0] - start[0]) * fly, y = start[1] + (end[1] - start[1]) * fly - 60 * Math.sin(Math.PI * fly);
      const appear = smooth((t - ot.in) / 0.35);
      obj.style.left = `${x.toFixed(1)}px`; obj.style.top = `${y.toFixed(1)}px`;
      obj.style.opacity = (appear * (1 - smooth((t - ot.gone + 0.12) / 0.18))).toFixed(3);
      obj.style.transform = `translateX(${(-40 * (1 - ease((t - ot.in) / 0.5))).toFixed(1)}px) scale(${(1 - 0.65 * fly).toFixed(4)}) rotate(${(-6 + 6 * fly).toFixed(2)}deg)`;
    }
    if (s.card === 'interfaces') {
      s.el.querySelectorAll('.tile').forEach((tile, k) => {
        const t0 = s.start + BEAT * (k + 1), o = smooth((t - t0) / 0.3);
        tile.style.opacity = o.toFixed(3);
        tile.style.transform = `translateY(${(40 * (1 - ease((t - t0) / 0.6))).toFixed(2)}px)`;
      });
    }
    // Caption: one beat after the scene starts; it stays to be read.
    const cap = s.el.querySelector('.caption');
    if (cap) {
      const c = smooth((t - s.start - BEAT * 0.5) / 0.4);
      cap.style.opacity = c.toFixed(3);
      cap.style.transform = `translateY(${(16 * (1 - ease((t - s.start - BEAT * 0.5) / 0.6))).toFixed(2)}px)`;
    }
    // Cursor: glides to the first outline and clicks one beat before it draws (scenes with an action).
    if (s.click && s.rings.length && v.pout < 0.5) {
      const m = markTimes(s, 0), r = $(s.rings[0].id).getBoundingClientRect();
      const target = [r.left + r.width / 2, r.top + r.height / 2], from = [target[0] + 260, target[1] + 220];
      const g = ease((t - (m.ring - BEAT * 2.5)) / (BEAT * 1.4));
      cursor = { x: from[0] + (target[0] - from[0]) * g, y: from[1] + (target[1] - from[1]) * g, o: v.pin * (1 - smooth((t - (m.label + BEAT)) / 0.4)), click: m.ring - BEAT };
    }
  });
  const cur = $('cursor'), rip = $('ripple');
  if (cursor) {
    const press = Math.exp(-Math.max(0, t - cursor.click) * 10) * (t >= cursor.click ? 1 : 0);
    cur.style.opacity = clamp(cursor.o).toFixed(3);
    cur.style.transform = `translate(${(cursor.x - 6).toFixed(1)}px, ${(cursor.y - 4).toFixed(1)}px) scale(${(1 - 0.15 * press).toFixed(3)})`;
    const rp = clamp((t - cursor.click) / 0.5);
    rip.style.left = `${cursor.x}px`; rip.style.top = `${cursor.y}px`;
    rip.style.opacity = (t < cursor.click || rp >= 1 ? 0 : (1 - rp) * 0.9).toFixed(3);
    rip.style.transform = `scale(${(0.3 + rp).toFixed(3)})`;
  } else { cur.style.opacity = '0'; rip.style.opacity = '0'; }

  // The badge leaves for the logo; subtitles only in the narrated version.
  $('badge').style.opacity = (1 - smooth((t - (SCENES.at(-1).start - TRANS)) / (2 * TRANS))).toFixed(3);
  const sub = $('subtitle');
  const line = VERSION === 'vo' ? VO.find(v => t >= v.start - 0.15 && t <= v.end + 0.15) : null;
  if (line) {
    sub.textContent = line.text;
    sub.style.opacity = (smooth((t - line.start + 0.15) / 0.15) * (1 - smooth((t - line.end) / 0.15))).toFixed(3);
  } else sub.style.opacity = '0';
  return t;
}

build();
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => { placeLabels(); seek(Number(params.get('t') ?? 0)); });
window.seek = seek;
window.SCORE = makeScore();
window.DURATION = DURATION;
window.MUSIC = MUSIC;
window.VO = VO;
window.SCENE_STARTS = SCENES.map(s => ({ bar: s.bar, start: s.start, label: s.caption ?? s.card }));
</script>
</body>
</html>
