# NAVI dedicated VPS HTTPS. Enable after issuance and a domain-origin static build.
# HTTP redirect is intentionally separate: preserve the ACME location during renewal.
server {
    listen 443 ssl http2;
    server_name navitw.com;
    ssl_certificate /etc/letsencrypt/live/navitw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navitw.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NAVI_TLS:1m;
    ssl_session_timeout 1d;
    root /opt/navi-hackathon/current/mock;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/navi-access.log navi;
    error_log /var/log/nginx/navi-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-NAVI-Environment synthetic-demo always;
    error_page 404 /404.html;
    location ~ /\. { deny all; }
    location ~ ^/_next/static/ { try_files $uri =404; expires 1y; }
    location ~ \.txt$ { expires -1; types { text/x-component txt; } try_files $uri =404; }
    location / { expires -1; try_files $uri $uri.html $uri/index.html =404; }
}
server {
    listen 443 ssl http2;
    server_name www.navitw.com;
    ssl_certificate /etc/letsencrypt/live/navitw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navitw.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 308 https://navitw.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name app.navitw.com;
    ssl_certificate /etc/letsencrypt/live/navitw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navitw.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NAVI_TLS:1m;
    ssl_session_timeout 1d;
    root /opt/navi-hackathon/current/web;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/navi-access.log navi;
    error_log /var/log/nginx/navi-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://navitw.com" always;
    add_header X-NAVI-Environment synthetic-demo always;
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /api { return 308 /api/; }
    location = / { expires -1; try_files /index.html =404; }
    location = /embed { expires -1; try_files /index.html =404; }
    location = /demo { expires -1; try_files /index.html =404; }
    location / { try_files $uri =404; }
    location /api/ {
        client_max_body_size 11m;
        client_body_timeout 15s;
        proxy_pass http://127.0.0.1:18172;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors off;
        error_page 502 503 504 = @api_unavailable;
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"success":false,"error":{"code":"API_UNAVAILABLE","message":"服務暫時無法使用，請稍後再試。","retryable":true}}';
    }
}
