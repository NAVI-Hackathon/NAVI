# NAVI IP demo. HTTP is for synthetic data only.
log_format navi '$time_iso8601 $request_method $uri $status $request_time';
server {
    listen 80 default_server;
    server_name @HOST@;
    root /opt/navi-hackathon/current/mock;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/navi-access.log navi;
    error_log /var/log/nginx/navi-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-NAVI-Environment synthetic-demo always;
    error_page 404 /404.html;
    location ~ /\. { deny all; }
    location ~ ^/_next/static/ { try_files $uri =404; expires 1y; }
    location ~ \.txt$ { expires -1; types { text/x-component txt; } try_files $uri =404; }
    location / { expires -1; try_files $uri $uri.html $uri/index.html =404; }
}
server {
    listen 8080 default_server;
    server_name @HOST@;
    root /opt/navi-hackathon/current/web;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/navi-access.log navi;
    error_log /var/log/nginx/navi-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'self' http://@HOST@" always;
    add_header X-NAVI-Environment synthetic-demo always;
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = / { expires -1; try_files /index.html =404; }
    location = /embed { expires -1; try_files /index.html =404; }
    location = /demo { expires -1; try_files /index.html =404; }
    location / { try_files $uri =404; }
    location /api/ {
        client_max_body_size 11m;
        client_body_timeout 15s;
        proxy_pass http://127.0.0.1:18172;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_request_buffering off;
        proxy_intercept_errors off;
        error_page 502 503 504 = @api_unavailable;
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"success":false,"error":{"code":"API_UNAVAILABLE","message":"服務暫時無法使用，請稍後再試。","retryable":true}}';
    }
}
